name: Build sqlx-cli Linux amd64 musl
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install musl system library
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build static release binary
        run: |
          cd sqlx-cli
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            --no-default-features \
            --features rustls,postgres,mysql,sqlite
          mv target/x86_64-unknown-linux-musl/release/sqlx ./sqlx-cli-linux-amd64-musl
          sha256sum sqlx-cli-linux-amd64-musl > sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-cli-linux-amd64-musl
          path: |
            sqlx-cli/sqlx-cli-linux-amd64-musl
            sqlx-cli/sha256sum.txt
