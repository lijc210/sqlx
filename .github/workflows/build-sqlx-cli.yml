name: Build sqlx-cli Linux amd64 musl

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target list --installed

      - name: Build static release binary
        working-directory: sqlx-cli
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            --no-default-features \
            --features rustls,postgres,mysql,sqlite

          cp ../target/x86_64-unknown-linux-musl/release/sqlx \
             ./sqlx-cli-linux-amd64-musl

          file ./sqlx-cli-linux-amd64-musl
          ldd ./sqlx-cli-linux-amd64-musl || true

          sha256sum ./sqlx-cli-linux-amd64-musl > sha256sum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            sqlx-cli/sqlx-cli-linux-amd64-musl
            sqlx-cli/sha256sum.txt
