name: Build sqlx-cli Linux amd64 musl

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 Git tag，例如 v0.9.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag
        run: |
          echo "Building tag: ${{ inputs.tag }}"
          git describe --tags --exact-match HEAD
          git status

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target list --installed

      - name: Build static release binary
        working-directory: sqlx-cli
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            --no-default-features \
            --features rustls,postgres,mysql,sqlite

          cp ../target/x86_64-unknown-linux-musl/release/sqlx \
             ./sqlx-cli-linux-amd64-musl

          file ./sqlx-cli-linux-amd64-musl
          ldd ./sqlx-cli-linux-amd64-musl || true

          sha256sum ./sqlx-cli-linux-amd64-musl > sha256sum.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: false
          files: |
            sqlx-cli/sqlx-cli-linux-amd64-musl
            sqlx-cli/sha256sum.txt
